name: backend-v2-ci

on:
  push:
    paths:
      - 'backend_v2/**'
      - 'pytest.ini'
      - '.github/workflows/backend-v2-ci.yml'
  pull_request:
    paths:
      - 'backend_v2/**'
      - 'pytest.ini'
      - '.github/workflows/backend-v2-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend_v2/requirements-dev.txt

      - name: Compile check
        run: python -m compileall backend_v2/app

      - name: Run tests
        run: python -m pytest -q
